<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Kontaktu - Pigułka</title>
    <style>
        /* Zmienne kolorystyczne dla formularza */
        :root {
            --widget-main-color: #C3C3C3;
            --widget-dark-grey: #555;
            --widget-border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* --- Główny kontener "Pigułka" (Zmniejszony o 25%) --- */
        #contact-widget-pill {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            background-color: #4a4a4a; /* Ciemnoszare tło pigułki */
            border-radius: 45px; /* Zmniejszono z 60px */
            display: flex;
            align-items: center;
            padding: 9px 11px; /* Zmniejszono z 12px 15px */
            gap: 11px; /* Zmniejszono z 15px */
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
        }

        /* --- Przyciski wewnątrz pigułki (Zmniejszone o 25%) --- */
        .pill-btn {
            width: 49px; /* Zmniejszono z 65px */
            height: 49px; /* Zmniejszono z 65px */
            border-radius: 50%;
            background-color: #e6e6e6; /* Jasnoszary środek */
            border: 4px solid #b0b0b0; /* Zmniejszono z 5px */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
            box-sizing: border-box;
            padding: 0;
        }

        .pill-btn:hover {
            transform: scale(1.05);
            background-color: #f0f0f0;
        }

        /* Styl ikon konturowych (Zmniejszone o 25%) */
        .pill-btn svg {
            width: 21px; /* Zmniejszono z 28px */
            height: 21px; /* Zmniejszono z 28px */
            fill: none;
            stroke: #333333; /* Ciemnoszary kolor obrysu ikony */
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- Modal / Formularz (Wersja Szara) --- */
        .widget-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 15px;
            box-sizing: border-box;
        }

        .widget-modal {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            box-sizing: border-box;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-intro { color: #666; margin-bottom: 25px; font-size: 14px; line-height: 1.5; padding-right: 20px; }

        .form-group { margin-bottom: 18px; }
        .form-group label { 
            display: block; 
            font-size: 14px; 
            color: var(--widget-dark-grey); 
            margin-bottom: 6px; 
            font-weight: 600; 
        }
        
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--widget-border-color);
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--widget-main-color);
            box-shadow: 0 0 0 3px rgba(195, 195, 195, 0.2);
        }

        .form-consent { display: flex; gap: 10px; font-size: 12px; color: #777; margin-bottom: 20px; align-items: flex-start; }
        
        .submit-btn {
            width: 100%;
            background: var(--widget-main-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none; font-size: 24px; cursor: pointer; color: #bbb;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Responsywność dla małych ekranów (Zmniejszone proporcjonalnie) --- */
        @media (max-width: 480px) {
            #contact-widget-pill { 
                bottom: 15px; 
                right: 15px; 
                padding: 7px 9px;
                gap: 9px;
            }
            .pill-btn { width: 41px; height: 41px; border-width: 3px; }
            .pill-btn svg { width: 18px; height: 18px; }
            .widget-modal { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Główny widget pigułka -->
    <div id="contact-widget-pill">
        
        <!-- Przycisk telefonu (lewy) -->
        <a href="tel:+48604543228" class="pill-btn" aria-label="Zadzwoń">
            <svg viewBox="0 0 24 24">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
        </a>

        <!-- Przycisk wiadomości (prawy) -->
        <button class="pill-btn" onclick="openMsgModal()" aria-label="Wyślij wiadomość">
            <svg viewBox="0 0 24 24">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        </button>

    </div>

    <!-- Modal Formularza -->
    <div class="widget-modal-overlay" id="msgModal">
        <div class="widget-modal">
            <button class="modal-close" onclick="closeMsgModal()">✕</button>
            <p class="modal-intro">Pozostaw wiadomość, odpowiemy na nią w najbliższym dniu roboczym.</p>
            <form id="widgetContactForm">
                <div class="form-group"><label>Imię *</label><input type="text" required></div>
                <div class="form-group"><label>Adres email *</label><input type="email" required></div>
                <div class="form-group"><label>Treść wiadomości *</label><textarea rows="4" required></textarea></div>
                <div class="form-consent">
                    <input type="checkbox" id="consent" required>
                    <label for="consent">Wyrażam zgodę na przetwarzanie danych osobowych.</label>
                </div>
                <button type="submit" class="submit-btn">Wyślij wiadomość</button>
            </form>
        </div>
    </div>

    <script>
        function openMsgModal() {
            document.getElementById('msgModal').style.display = 'flex';
        }

        function closeMsgModal() { 
            document.getElementById('msgModal').style.display = 'none'; 
        }

        // Zamknięcie modala po kliknięciu w tło
        window.onclick = function(e) { 
            if (e.target == document.getElementById('msgModal')) {
                closeMsgModal(); 
            }
        }

        // Obsługa wysłania formularza
        document.getElementById('widgetContactForm').onsubmit = function(e) {
            e.preventDefault();
            alert('Wysłano!');
            closeMsgModal();
        };
    </script>
</body>
</html>
