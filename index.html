<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Kontaktu v4</title>
    <style>
        :root {
            --widget-main-color: #C3C3C3;
            --widget-dark-grey: #555;
            --widget-border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        #contact-widget-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        /* --- Przycisk główny (Wycentrowany) --- */
        .widget-main-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: var(--widget-main-color);
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0; /* Usuwamy padding, by nie psuł centrowania */
            transition: background-color 0.3s;
        }

        /* Styl grubszej słuchawki */
        .widget-main-btn svg, .widget-btn svg { 
            width: 32px; /* Nieco większa dla lepszej widoczności */
            height: 32px;
            fill: white; 
            display: block; /* Usuwa białe znaki pod SVG */
        }

        .widget-main-btn .icon-close { 
            display: none; 
            font-size: 28px; 
            color: white;
            line-height: 1;
        }

        /* --- Menu opcji --- */
        .widget-menu {
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
            align-items: flex-end;
        }

        .widget-option {
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeInVertical 0.3s ease-out;
        }

        .widget-tooltip {
            background: #444;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            position: relative;
        }

        .widget-tooltip::after {
            content: "";
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: transparent transparent transparent #444;
        }

        .widget-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: var(--widget-main-color);
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-decoration: none;
        }
        .widget-btn svg { width: 26px; height: 26px; }

        /* --- Modal (Wersja Szara) --- */
        .widget-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 15px;
        }

        .widget-modal {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        .modal-intro { color: #666; margin-bottom: 25px; font-size: 14px; line-height: 1.5; padding-right: 20px; }

        .form-group { margin-bottom: 18px; }
        .form-group label { 
            display: block; 
            font-size: 14px; 
            color: var(--widget-dark-grey); 
            margin-bottom: 6px; 
            font-weight: 600; 
        }
        
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--widget-border-color);
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--widget-main-color);
            box-shadow: 0 0 0 3px rgba(195, 195, 195, 0.2);
        }

        .form-consent { display: flex; gap: 10px; font-size: 12px; color: #777; margin-bottom: 20px; align-items: flex-start; }
        
        .submit-btn {
            width: 100%;
            background: var(--widget-main-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none; font-size: 24px; cursor: pointer; color: #bbb;
        }

        @keyframes fadeInVertical {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RWD --- */
        @media (max-width: 480px) {
            #contact-widget-container { bottom: 15px; right: 15px; }
            .widget-main-btn { width: 55px; height: 55px; }
            .widget-main-btn svg { width: 26px; height: 26px; }
            .widget-modal { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="contact-widget-container">
        <div class="widget-menu" id="widgetMenu">
            <div class="widget-option">
                <span class="widget-tooltip">Zamów rozmowę</span>
                <a href="tel:+48604543228" class="widget-btn">
                    <!-- Grubsza słuchawka -->
                    <svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>
                </a>
            </div>
            <div class="widget-option">
                <span class="widget-tooltip">Wyślij wiadomość</span>
                <button class="widget-btn" onclick="openMsgModal()">
                    <svg viewBox="0 0 24 24"><path d="M20,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V6C22,4.89 21.11,4 20,4M20,18H4V8L12,13L20,8V18M12,11L4,6H20L12,11Z"/></svg>
                </button>
            </div>
        </div>

        <button class="widget-main-btn" id="widgetToggle" onclick="toggleWidgetMenu()">
            <span class="icon-open">
                <svg viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>
            </span>
            <span class="icon-close">✕</span>
        </button>

        <div class="widget-modal-overlay" id="msgModal">
            <div class="widget-modal">
                <button class="modal-close" onclick="closeMsgModal()">✕</button>
                <p class="modal-intro">Pozostaw wiadomość, odpowiemy na nią w najbliższym dniu roboczym.</p>
                <form id="widgetContactForm">
                    <div class="form-group"><label>Imię *</label><input type="text" required></div>
                    <div class="form-group"><label>Adres email *</label><input type="email" required></div>
                    <div class="form-group"><label>Treść wiadomości *</label><textarea rows="4" required></textarea></div>
                    <div class="form-consent">
                        <input type="checkbox" id="consent" required>
                        <label for="consent">Wyrażam zgodę na przetwarzanie danych osobowych.</label>
                    </div>
                    <button type="submit" class="submit-btn">Wyślij wiadomość</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleWidgetMenu() {
            const menu = document.getElementById('widgetMenu');
            const btn = document.getElementById('widgetToggle');
            const isOpen = menu.style.display === 'flex';
            menu.style.display = isOpen ? 'none' : 'flex';
            btn.querySelector('.icon-open').style.display = isOpen ? 'block' : 'none';
            btn.querySelector('.icon-close').style.display = isOpen ? 'none' : 'block';
        }
        function openMsgModal() {
            document.getElementById('msgModal').style.display = 'flex';
            toggleWidgetMenu();
        }
        function closeMsgModal() { document.getElementById('msgModal').style.display = 'none'; }
        window.onclick = function(e) { if (e.target == document.getElementById('msgModal')) closeMsgModal(); }
        document.getElementById('widgetContactForm').onsubmit = function(e) {
            e.preventDefault();
            alert('Wysłano!');
            closeMsgModal();
        };
    </script>
</body>
</html>
